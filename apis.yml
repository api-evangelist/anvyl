name: Anvyl
description: >-
  Anvyl is a supply chain and production management platform (a "Production Hub")
  for consumer-brand and e-commerce companies, connecting brands with their
  suppliers to manage the purchase-order and manufacturing lifecycle in one
  place: issuing and tracking purchase orders, coordinating production
  milestones and tasks, managing suppliers and SKUs/products, and monitoring
  inbound shipments and logistics. Anvyl was acquired by Sage and now operates
  under the Sage umbrella. It exposes a token-authenticated REST API
  (api.anvyl.com/api/v1) documented via Stoplight, with resources such as
  purchase orders. This profile was surfaced as a portfolio company of
  Redpoint Ventures and enriched by the API Evangelist pipeline from Anvyl's
  live public developer surface.
